[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "geohexgrid"
version = "3.0.1"
description = "A Python library for making geographic flat-top hexagon grids like QGIS's create grid function"
readme = "README.rst"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Alexander Raichev", email = "alexander@raichev.net" },
]
keywords = ["geospatial", "geopandas", "hexagon", "grid", "gis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "geopandas>=0.11.1",
  "numpy",
  "pandas>=2",
  "shapely",
]

[dependency-groups]
dev = [
  "loguru>=0.7.2",
  "marimo>=0.13.15",
  "matplotlib>=3.8.1",
  "pre-commit-uv>=0.1",
  "pytest>=7.1.2",
  "ruff>=0.1.3",
]

[project.urls]
Homepage = "https://github.com/araichev/geohexgrid"
Repository = "https://github.com/araichev/geohexgrid"
Issues = "https://github.com/araichev/geohexgrid/issues"

[tool.hatch.build.targets.wheel]
packages = ["geohexgrid"]


[tool.ruff]
line-length = 90
exclude = ["notebooks/*.py"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "F401", "F403"]